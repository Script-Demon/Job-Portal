server:
  port: ${PORT:8080}

spring:
  application:
    name: job-portal
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobportal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    # Base64-encoded HMAC key (>= 256 bits). Override JWT_SECRET in production.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLWpvYi1wb3J0YWwtMjAyNg==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload-dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@jobportal.com}
    password: ${ADMIN_PASSWORD:Admin@123}
  seed-demo: ${SEED_DEMO:true}
